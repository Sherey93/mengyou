<head></head>
<body>
  <main class="welcome">
    <header class="head">
      <h1 class="title">梦游的妈妈</h1>
      <p class="sub">一墙之隔，三个人，和一个说不出口的夜</p>
    </header>

    <div class="hero" aria-hidden="true">
      <div class="corridor">
        <span class="wall"></span>
        <span class="door door-left"><i class="crack"></i></span>
        <span class="door door-right"><i class="crack"></i></span>
        <span class="floor"></span>
      </div>
      <p class="hero-caption">十二楼 · 走廊十二步 · 实木地板会响</p>
    </div>

    <section class="story" id="storyArea">
      <p class="story-label">前 情</p>
      <div class="typewriter" id="typewriter"></div>
      <span class="skip-hint" id="skipHint">点一下跳过</span>
    </section>

    <ul class="hints">
      <li>台阶只能由你自己踩上去，她不替你走。</li>
      <li>你什么都不做，这一夜也成立。</li>
      <li>隔着一堵墙，睡着的是你父亲。</li>
    </ul>

    <div class="action">
      <button class="enter" id="enterBtn" type="button">推 开 门</button>
      <p class="footnote">点下去，这一楼会翻到开场白</p>
    </div>
  </main>
</body>
