<head></head>
<body>
  <main class="welcome">
    <header class="head">
      <h1 class="title">梦游的妈妈</h1>
      <p class="sub">一墙之隔，熟睡的父亲，和深夜钻进你被窝里的温热身体</p>
    </header>

    <div class="hero" aria-hidden="true">
      <div class="corridor">
        <span class="wall"></span>
        <span class="door door-left"><i class="crack"></i></span>
        <span class="door door-right"><i class="crack"></i></span>
        <span class="floor"></span>
      </div>
      <p class="hero-caption">一墙之隔 · 真空棉睡衣 · 呼吸交缠</p>
    </div>

    <section class="story" id="storyArea">
      <p class="story-label">前 情</p>
      <div class="typewriter" id="typewriter"></div>
    </section>

    <section class="guide">
      <p class="story-label">玩法提示</p>
      <ul class="hints">
        <li>一步步试探，还是彻底撕破伪装，主动权在你手里。</li>
        <li>就算你屏息不动，她积压的渴望也会在下一个深夜悄然失控。</li>
        <li>记住压低声音，一墙之隔，睡着的是你父亲。</li>
      </ul>
    </section>

    <div class="action">
      <button class="enter" id="enterBtn" type="button">睁 开 眼</button>
      <p class="footnote">睁开眼，你那娇憨的母亲正抱着你。</p>
    </div>
  </main>
</body>
